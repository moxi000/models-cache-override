name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Plan the next release
        id: plan
        run: |
          set -euo pipefail
          message="$(git log -1 --pretty=%s)"
          if [[ "$message" == Release\ v* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --tags --force
          latest="$(git tag -l 'v*' --sort=-v:refname | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | head -1 || true)"
          if [[ -z "$latest" ]]; then
            version="1.0.0"
          else
            base="${latest#v}"
            major="${base%%.*}"
            rest="${base#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            version="${major}.${minor}.$((patch + 1))"
          fi
          sed -i -E "s/pluginVersion = \"[^\"]+\"/pluginVersion = \"${version}\"/" abi.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add abi.go
          git commit -m "Release v${version}"
          git tag "v${version}"
          git push origin HEAD "v${version}"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            goos: darwin
            goarch: arm64
            extension: dylib
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            extension: dylib
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            extension: so
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            extension: so
          - runner: windows-2025
            goos: windows
            goarch: amd64
            extension: dll
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Validate version
        run: grep -Eq "pluginVersion[[:space:]]*=[[:space:]]*\"${{ needs.version.outputs.version }}\"" abi.go

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"

      - name: Install MinGW
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install mingw -y

      - name: Test
        run: go test ./...

      - name: Build native plugin
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.goos }}
        run: |
          mkdir -p dist/stage
          go build -trimpath -buildmode=c-shared \
            -o dist/stage/models-cache-override.${{ matrix.extension }} .
          rm -f dist/stage/models-cache-override.h

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/stage/models-cache-override.${{ matrix.extension }}
          if-no-files-found: error

  release:
    needs: [version, build]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: staging

      - name: Package platform libraries
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          for platform in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64 windows-amd64; do
            goos="${platform%-*}"
            goarch="${platform#*-}"
            case "$goos" in
              darwin) extension=dylib ;;
              linux) extension=so ;;
              windows) extension=dll ;;
            esac
            library="models-cache-override.${extension}"
            source="staging/release-${platform}/${library}"
            archive="models-cache-override_${VERSION}_${goos}_${goarch}.zip"
            test -f "$source"
            (
              cd "staging/release-${platform}"
              zip -q "${GITHUB_WORKSPACE}/dist/${archive}" "$library"
            )
            test "$(unzip -Z1 "dist/${archive}")" = "$library"
          done
          test "$(find dist -maxdepth 1 -name '*.zip' -type f | wc -l | tr -d ' ')" = 5

      - name: Create checksums
        run: |
          (
            cd dist
            sha256sum models-cache-override_*.zip > checksums.txt
            sha256sum -c checksums.txt
          )

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          files: |
            dist/models-cache-override_*.zip
            dist/checksums.txt
